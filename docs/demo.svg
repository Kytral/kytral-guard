<svg xmlns="http://www.w3.org/2000/svg" width="920" height="362" viewBox="0 0 920 362" role="img" aria-label="Kytral Guard blocks an agent's catastrophic commands and lets routine work through">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre}@keyframes k0{0%,2.50%{opacity:0}4.00%,92%{opacity:1}96%,100%{opacity:0}}.l0{opacity:0;animation:k0 16s linear infinite}@keyframes k1{0%,8.75%{opacity:0}10.25%,92%{opacity:1}96%,100%{opacity:0}}.l1{opacity:0;animation:k1 16s linear infinite}@keyframes k2{0%,15.00%{opacity:0}16.50%,92%{opacity:1}96%,100%{opacity:0}}.l2{opacity:0;animation:k2 16s linear infinite}@keyframes k3{0%,21.25%{opacity:0}22.75%,92%{opacity:1}96%,100%{opacity:0}}.l3{opacity:0;animation:k3 16s linear infinite}@keyframes k4{0%,27.50%{opacity:0}29.00%,92%{opacity:1}96%,100%{opacity:0}}.l4{opacity:0;animation:k4 16s linear infinite}@keyframes k5{0%,33.75%{opacity:0}35.25%,92%{opacity:1}96%,100%{opacity:0}}.l5{opacity:0;animation:k5 16s linear infinite}@keyframes k6{0%,40.00%{opacity:0}41.50%,92%{opacity:1}96%,100%{opacity:0}}.l6{opacity:0;animation:k6 16s linear infinite}@keyframes k7{0%,46.25%{opacity:0}47.75%,92%{opacity:1}96%,100%{opacity:0}}.l7{opacity:0;animation:k7 16s linear infinite}@keyframes k8{0%,52.50%{opacity:0}54.00%,92%{opacity:1}96%,100%{opacity:0}}.l8{opacity:0;animation:k8 16s linear infinite}@keyframes k9{0%,58.75%{opacity:0}60.25%,92%{opacity:1}96%,100%{opacity:0}}.l9{opacity:0;animation:k9 16s linear infinite}@keyframes k10{0%,65.00%{opacity:0}66.50%,92%{opacity:1}96%,100%{opacity:0}}.l10{opacity:0;animation:k10 16s linear infinite}@keyframes k11{0%,71.25%{opacity:0}72.75%,92%{opacity:1}96%,100%{opacity:0}}.l11{opacity:0;animation:k11 16s linear infinite}@media (prefers-reduced-motion:reduce){g{animation:none!important;opacity:1!important}}</style>
<rect width="920" height="362" rx="10" fill="#0d1117"/>
<rect width="920" height="30" rx="10" fill="#161b22"/><rect y="20" width="920" height="10" fill="#161b22"/>
<circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
<text x="460" y="20" fill="#8b949e" text-anchor="middle" style="font-size:12px">coding agent + kytral-guard hook (coding-agent preset)</text>
<g class="l0"><text x="24" y="52" fill="#79c0ff">you   </text><text x="92" y="52" fill="#c9d1d9">Tests are flaky. Clean everything up and start over.</text></g><g class="l1"><text x="24" y="76" fill="#8b949e">agent </text><text x="92" y="76" fill="#c9d1d9">rm -rf ~/projects</text></g><g class="l2"><text x="24" y="100" fill="#ff7b72">guard </text><text x="92" y="100" fill="#ff7b72">BLOCK    rm -r ~/projects (rule shell-catastrophic)</text></g><g class="l3"><text x="24" y="124" fill="#8b949e">agent </text><text x="92" y="124" fill="#c9d1d9">psql -h prod-db -c 'DROP TABLE users'</text></g><g class="l4"><text x="24" y="148" fill="#ff7b72">guard </text><text x="92" y="148" fill="#ff7b72">BLOCK    drop table users (drops it) (rule sql-destructive)</text></g><g class="l5"><text x="24" y="172" fill="#8b949e">agent </text><text x="92" y="172" fill="#c9d1d9">git push --force origin main</text></g><g class="l6"><text x="24" y="196" fill="#ff7b72">guard </text><text x="92" y="196" fill="#ff7b72">BLOCK    git push --force/--delete on a shared branch (rule shell-catastrophic)</text></g><g class="l7"><text x="24" y="220" fill="#8b949e">agent </text><text x="92" y="220" fill="#c9d1d9">git reset --hard</text></g><g class="l8"><text x="24" y="244" fill="#e3b341">guard </text><text x="92" y="244" fill="#e3b341">ASK      git reset --hard (discards uncommitted work) (rule shell-destructive)</text></g><g class="l9"><text x="24" y="268" fill="#8b949e">agent </text><text x="92" y="268" fill="#c9d1d9">rm -rf node_modules dist</text></g><g class="l10"><text x="24" y="292" fill="#3fb950">guard </text><text x="92" y="292" fill="#3fb950">ALLOW    no rule matched</text></g><g class="l11"><text x="24" y="316" fill="#8b949e">agent </text><text x="92" y="316" fill="#c9d1d9">Kytral Guard blocked three of these. Should I reset only the test database?</text></g>
</svg>
